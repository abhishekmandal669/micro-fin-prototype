<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E298" />
      <stop offset="50%" stop-color="#D4A228" />
      <stop offset="100%" stop-color="#8C6610" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241C12" />
      <stop offset="100%" stop-color="#120E09" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#D4A228" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Outer Ring with dark luxury background -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow)" />
  <!-- Inner Coin Ridge -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#E7C874" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.85" />
  <!-- Inner Core Circle -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#D4A228" stroke-width="0.8" opacity="0.6" />
  <!-- Letter S Monogram -->
  <text x="32" y="42" font-family="'Fraunces', 'Georgia', serif" font-size="28" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-0.5">S</text>
</svg>
